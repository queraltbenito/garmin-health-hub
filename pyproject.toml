[project]
name = "garmin-health-hub"
version = "0.1.0"
description = "Dashboard personal de salud con datos de la Garmin Personal API"
readme = "README.md"
authors = [
    { name = "queraltbenito7", email = "94627489+queraltbenito7@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "garmin_hub"